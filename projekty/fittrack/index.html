<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack | Aggressive Training</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050505; }
        .teko { font-family: 'Teko', sans-serif; text-transform: uppercase; line-height: 0.8; }
        .parallax-wrap { perspective: 1000px; }
        .phone-tilt { transform-style: preserve-3d; transition: transform 0.1s ease-out; }
        .heart-pulse { animation: pulse 1.2s infinite; }
        @keyframes pulse { 
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
    </style>
</head>
<body class="text-white overflow-hidden selection:bg-rose-600">

    <div class="fixed top-0 w-full p-8 flex justify-between items-center z-50">
        <span class="teko text-4xl tracking-widest">FIT<span class="text-rose-600">.</span>TRACK</span>
        <div class="flex items-center gap-4 bg-white/5 backdrop-blur-xl px-4 py-2 rounded-full border border-white/10">
            <span class="w-2 h-2 bg-rose-600 rounded-full heart-pulse shadow-[0_0_10px_#e11d48]"></span>
            <span class="text-xs font-bold tracking-tighter uppercase">Live Sync: 72 BPM</span>
        </div>
    </div>

    <main class="relative min-h-screen flex items-center justify-center px-6">
        <!-- Background Grid -->
        <div class="absolute inset-0 opacity-20" style="background-image: linear-gradient(#333 1px, transparent 1px), linear-gradient(90deg, #333 1px, transparent 1px); background-size: 50px 50px;"></div>
        
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center gap-20 relative z-10">
            <div class="md:w-1/2">
                <h1 class="teko text-[150px] lg:text-[220px] mb-4">HUSTLE<br><span class="text-transparent" style="-webkit-text-stroke: 2px #e11d48;">HARDER</span></h1>
                <p class="text-xl text-white/40 max-w-md font-medium mb-10 leading-tight">Zmień swoje ciało dzięki analityce opartej na AI. Jedyna aplikacja, która nie akceptuje wymówek.</p>
                <button class="bg-rose-600 hover:bg-rose-700 text-white px-12 py-5 rounded-full font-black uppercase italic tracking-widest transition-all hover:scale-105 shadow-2xl shadow-rose-600/20">Zacznij Trening</button>
            </div>

            <div class="md:w-1/2 parallax-wrap">
                <div id="phone" class="phone-tilt w-[320px] h-[640px] bg-slate-900 border-[10px] border-slate-800 rounded-[3.5rem] relative shadow-[0_50px_100px_rgba(225,29,72,0.2)] overflow-hidden">
                    <div class="absolute top-0 w-full h-full bg-gradient-to-b from-rose-600/20 to-transparent"></div>
                    <div class="p-8 pt-16 flex flex-col h-full relative z-10">
                        <p class="text-rose-500 font-bold uppercase text-xs mb-2">Today's Goal</p>
                        <h2 class="text-4xl font-black mb-8 italic">92% DONE</h2>
                        
                        <!-- Visual Graph (Canvas/SVG Mock) -->
                        <div class="flex-1 flex items-end gap-2 h-32">
                            <div class="flex-1 bg-rose-600 rounded-t-lg" style="height: 40%"></div>
                            <div class="flex-1 bg-rose-600 rounded-t-lg" style="height: 70%"></div>
                            <div class="flex-1 bg-rose-600 rounded-t-lg" style="height: 55%"></div>
                            <div class="flex-1 bg-white rounded-t-lg" style="height: 90%"></div>
                            <div class="flex-1 bg-rose-600 rounded-t-lg" style="height: 30%"></div>
                        </div>
                        
                        <div class="mt-auto bg-white text-black p-6 rounded-3xl font-black text-center uppercase tracking-widest">UPGRADE TO PRO</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const phone = document.getElementById('phone');
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 20;
            const y = (window.innerHeight / 2 - e.pageY) / 20;
            phone.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
        });
    </script>
</body>
</html>
