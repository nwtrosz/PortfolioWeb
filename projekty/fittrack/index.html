<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack - Twoja Aplikacja Fitness</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { font-family: 'Space Grotesk', sans-serif; }</style>
</head>
<body class="bg-black text-white">
    <div class="fixed top-0 w-full p-6 flex justify-between bg-black/50 backdrop-blur-xl border-b border-white/10">
        <span class="font-bold text-xl tracking-tighter">FIT.TRACK</span>
        <button class="bg-white text-black px-6 py-2 rounded-lg font-bold text-sm">POBIERZ APP</button>
    </div>
    <main class="pt-40 pb-20 px-6 text-center overflow-hidden">
        <h1 class="text-7xl md:text-[120px] font-black uppercase leading-none tracking-tighter mb-10">
            Hustle <br> <span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-rose-600">Harder.</span>
        </h1>
        <div class="max-w-xl mx-auto relative">
            <div class="absolute -top-10 -left-10 w-40 h-40 bg-orange-500/20 blur-[100px]"></div>
            <div class="absolute -bottom-10 -right-10 w-40 h-40 bg-rose-500/20 blur-[100px]"></div>
            <p class="text-white/60 text-lg mb-12">Monitoruj postępy, planuj treningi i rywalizuj ze znajomymi. Jedyna aplikacja, której potrzebujesz do formy życia.</p>
            <div class="flex flex-wrap justify-center gap-6">
                <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" class="h-12 opacity-80 hover:opacity-100 transition-opacity pointer-events-none">
                <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" class="h-12 opacity-80 hover:opacity-100 transition-opacity pointer-events-none">
            </div>
        </div>
    </main>
</body>
</html>
