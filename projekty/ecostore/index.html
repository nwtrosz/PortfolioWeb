<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoStore | Organic Essence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:italic,wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Lato', sans-serif; background-color: #fcfcf9; }
        .serif { font-family: 'Playfair Display', serif; }
        .reveal { opacity: 0; transform: translateY(30px); transition: all 1s ease-out; }
        .reveal.active { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="text-slate-800 antialiased">
    <nav class="p-10 flex justify-between items-center max-w-7xl mx-auto">
        <a href="#" class="serif text-3xl italic font-bold">EcoStore.</a>
        <div class="flex gap-12 font-medium text-xs uppercase tracking-[0.3em] text-slate-400">
            <a href="#">Shop</a><a href="#">Philosophy</a><a href="#">Blog</a>
        </div>
    </nav>

    <header class="max-w-7xl mx-auto px-6 pt-20 pb-40 grid md:grid-cols-2 gap-20 items-center">
        <div class="reveal">
            <span class="text-emerald-700 font-bold text-xs uppercase tracking-widest mb-6 block">Collection 2026</span>
            <h1 class="serif text-7xl lg:text-9xl italic mb-10 leading-none">Pure <br> Balance.</h1>
            <p class="text-xl text-slate-500 font-light max-w-sm mb-12">Ręcznie tworzone kosmetyki z organicznych składników. Bez chemii, z szacunkiem do natury.</p>
            <button class="bg-[#2C4A3B] text-white px-10 py-4 font-bold uppercase text-xs tracking-widest hover:bg-emerald-900 transition-all">Odkryj kolekcję</button>
        </div>
        <div class="relative reveal" style="transition-delay: 0.3s;">
            <div class="aspect-[4/5] bg-emerald-50 rounded-t-full flex items-center justify-center text-[120px] shadow-2xl">🌿</div>
        </div>
    </header>

    <section class="py-24 px-6 max-w-7xl mx-auto">
        <div class="text-center mb-16 serif italic text-4xl">Bestsellery</div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-8">
            <div class="reveal"><div class="aspect-[4/5] bg-gray-100 flex items-center justify-center text-5xl mb-4 hover:shadow-lg transition-shadow">🧴</div><p class="font-bold text-center">Olejek Różany</p></div>
            <div class="reveal" style="transition-delay: 0.1s;"><div class="aspect-[4/5] bg-gray-100 flex items-center justify-center text-5xl mb-4 hover:shadow-lg transition-shadow">🧼</div><p class="font-bold text-center">Mydło Węglowe</p></div>
            <div class="reveal" style="transition-delay: 0.2s;"><div class="aspect-[4/5] bg-gray-100 flex items-center justify-center text-5xl mb-4 hover:shadow-lg transition-shadow">🕯️</div><p class="font-bold text-center">Świeca Sojowa</p></div>
            <div class="reveal" style="transition-delay: 0.3s;"><div class="aspect-[4/5] bg-gray-100 flex items-center justify-center text-5xl mb-4 hover:shadow-lg transition-shadow">🍵</div><p class="font-bold text-center">Zestaw Matcha</p></div>
        </div>
    </section>

    <script>
        const obs = new IntersectionObserver((es) => { es.forEach(e => { if(e.isIntersecting) e.target.classList.add('active'); }); }, {threshold: 0.1});
        document.querySelectorAll('.reveal').forEach(e => obs.observe(e));
    </script>
</body>
</html>
